name: drivero_automa
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+2
  path_provider: ^2.1.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.0.0
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^15.1.3
  get_it: ^8.2.0
  dio: ^5.9.0
  equatable: ^2.0.7
  logger: ^2.6.1
  intl: ^0.20.2
  image: ^4.1.3
  dartz: ^0.10.1
  connectivity_plus: ^7.0.0
  google_fonts: ^6.3.1
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  bloc: ^9.0.0
  persistent_bottom_nav_bar_v2: ^6.1.0
  syncfusion_flutter_datepicker: ^31.1.18
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter-Thin.ttf
          weight: 100
        - asset: assets/font/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Inter-Light.ttf
          weight: 300
        - asset: assets/font/Inter-Regular.ttf
          weight: 400
        - asset: assets/font/Inter-Medium.ttf
          weight: 500
        - asset: assets/font/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/font/Inter-Bold.ttf
          weight: 700
        - asset: assets/font/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Inter-Black.ttf
          weight: 900
